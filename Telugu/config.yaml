model:
  max_seq_len: 1000
  multi_speaker: true
  transformer:
    conv_filter_size: 1024
    conv_kernel_size:
    - 9
    - 1
    decoder_dropout: 0.2
    decoder_head: 2
    decoder_hidden: 256
    decoder_layer: 6
    encoder_dropout: 0.2
    encoder_head: 2
    encoder_hidden: 256
    encoder_layer: 4
  variance_embedding:
    energy_quantization: linear
    n_bins: 256
    pitch_quantization: linear
  variance_predictor:
    dropout: 0.5
    filter_size: 256
    kernel_size: 3
  vocoder:
    model: HiFi-GAN
    speaker: universal
preprocess:
  dataset: Telugu
  path:
    corpus_path: ./raw_data/Telugu
    lexicon_path: lexicon/librispeech-lexicon.txt
    preprocessed_path: ./preprocessed_data/Telugu
    raw_path: ./raw_data/Telugu
  preprocessing:
    audio:
      max_wav_value: 32768.0
      sampling_rate: 22050
    energy:
      feature: phoneme_level
      normalization: true
    mel:
      mel_fmax: 8000
      mel_fmin: 0
      n_mel_channels: 80
    pitch:
      feature: phoneme_level
      normalization: true
    stft:
      filter_length: 1024
      hop_length: 256
      win_length: 1024
    text:
      language: en
      text_cleaners:
      - basic_cleaners
    val_size: 0
train:
  optimizer:
    anneal_rate: 0.3
    anneal_steps:
    - 300000
    - 400000
    - 500000
    batch_size: 16
    betas:
    - 0.9
    - 0.98
    eps: 1.0e-09
    grad_acc_step: 1
    grad_clip_thresh: 1.0
    warm_up_step: 4000
    weight_decay: 0.0
  path:
    ckpt_path: ./output/ckpt/Telugu
    log_path: ./output/log/Telugu
    result_path: ./output/result/Telugu
  step:
    log_step: 100
    save_step: 5000
    synth_step: 1000
    total_step: 20000
    val_step: 1000
