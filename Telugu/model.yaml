max_seq_len: 1000
multi_speaker: true
transformer:
  conv_filter_size: 1024
  conv_kernel_size:
  - 9
  - 1
  decoder_dropout: 0.2
  decoder_head: 2
  decoder_hidden: 256
  decoder_layer: 6
  encoder_dropout: 0.2
  encoder_head: 2
  encoder_hidden: 256
  encoder_layer: 4
variance_embedding:
  energy_quantization: linear
  n_bins: 256
  pitch_quantization: linear
variance_predictor:
  dropout: 0.5
  filter_size: 256
  kernel_size: 3
vocoder:
  model: HiFi-GAN
  speaker: universal
